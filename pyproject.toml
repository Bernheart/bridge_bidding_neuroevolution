[project]
name = "bridgebid"
version = "0.1.0"
description = "Learning competitive contract-bridge bidding with evolution strategies and PPO on Apple MLX"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mlx>=0.32",
    "numpy>=2.0",
    "omegaconf>=2.3",
    "tensorboardX>=2.6",
    "tensorboard>=2.18",
    "matplotlib>=3.9",
    "rich>=13.7",
    "safetensors>=0.4",
    "huggingface-hub>=0.26",
]

[project.scripts]
bridgebid = "bridgebid.cli.main:main"

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6.100", "ruff>=0.7"]
# Reference implementations, used only by the cross-check tests (CPU).
oracle = ["jax[cpu]", "pgx==2.6.0", "endplay>=0.5.12"]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bridgebid"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "oracle: cross-checks against Pgx / endplay (needs `uv sync --group oracle`)",
    "slow: long-running tests",
]
addopts = "-m 'not oracle and not slow'"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["legacy"]  # frozen snapshot of the GA version, not linted

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E741"]

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.ruff.lint.per-file-ignores]
"scripts/bench_mlx.py" = ["B023", "B905"]  # lambdas are timed immediately inside their loop
